<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务状态 - 777-MS Memory System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260314">
    <style>
        .status-container { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
        .status-header { text-align: center; margin-bottom: 48px; padding-top: 80px; }
        .status-header h1 { font-size: 36px; margin-bottom: 12px; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-header p { color: var(--text-secondary); font-size: 18px; }
        
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); }
        .nav-container { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 1200px; margin: 0 auto; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: var(--text-primary); text-decoration: none; }
        .logo-icon { width: 32px; height: 32px; background: var(--gradient-primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .nav-links { display: flex; align-items: center; gap: 32px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-cyan); }
        
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-bottom: 48px; }
        
        .status-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .status-card.online { border-color: var(--accent-green); }
        .status-card h3 { font-size: 18px; margin-bottom: 12px; }
        .status-card .status-value { font-size: 32px; font-weight: 700; color: var(--accent-green); }
        .status-card .status-desc { color: var(--text-secondary); font-size: 14px; margin-top: 8px; }
        
        .uptime-section { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .uptime-section h2 { font-size: 20px; margin-bottom: 16px; }
        .uptime-bar { height: 8px; background: var(--accent-green); border-radius: 4px; width: 99.9%; }
        .uptime-text { display: flex; justify-content: space-between; margin-top: 12px; color: var(--text-secondary); font-size: 14px; }
        
        .status-footer { text-align: center; padding: 40px 24px; border-top: 1px solid var(--border-color); color: var(--text-secondary); margin-top: 48px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon"><i class="bi bi-cpu"></i></div>
                <span>777-MS</span>
            </a>
            <div class="nav-links">
                <a href="/docs">文档</a>
                <a href="/pricing">定价</a>
                <a href="/api">API</a>
                <a href="/dashboard">控制台</a>
                <a href="/login" class="btn btn-outline">登录</a>
                <a href="/login?register=true" class="btn btn-primary">免费开始</a>
            </div>
        </div>
    </nav>

    <div class="status-container">
        <div class="status-header">
            <h1><i class="bi bi-activity"></i> 服务状态</h1>
            <p>777-MS 系统运行状态监控</p>
        </div>

        <div class="status-grid">
            <div class="status-card online">
                <h3><i class="bi bi-server"></i> API 服务</h3>
                <div class="status-value">正常运行</div>
                <div class="status-desc">所有 API 端点正常响应</div>
            </div>
            <div class="status-card online">
                <h3><i class="bi bi-database"></i> 数据库</h3>
                <div class="status-value">正常运行</div>
                <div class="status-desc">MySQL 连接稳定</div>
            </div>
            <div class="status-card online">
                <h3><i class="bi bi-chat-dots"></i> WebSocket</h3>
                <div class="status-value">正常运行</div>
                <div class="status-desc">实时通信服务正常</div>
            </div>
            <div class="status-card online">
                <h3><i class="bi bi-cpu"></i> LLM 路由</h3>
                <div class="status-value">正常运行</div>
                <div class="status-desc">23+ 提供商可用</div>
            </div>
        </div>

        <div class="uptime-section">
            <h2><i class="bi bi-graph-up"></i> 系统正常运行时间</h2>
            <div class="uptime-bar"></div>
            <div class="uptime-text">
                <span>过去 30 天</span>
                <span>99.9% 可用性</span>
            </div>
        </div>

        <div class="uptime-section">
            <h2><i class="bi bi-clock-history"></i> 最近事件</h2>
            <p style="color: var(--text-secondary);">过去 30 天内无重大事件报告</p>
        </div>
    </div>

    <div class="status-footer">
        <p>© 2025 777-MS Memory System. All rights reserved.</p>
    </div>
</body>
</html>
